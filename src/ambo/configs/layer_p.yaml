# Layer P: synthetic advertiser with disclosed truth.
# One model serves every layer; this file only says where the data comes from,
# what the priors are and how the sampler runs. The truth block is written to
# data/synthetic/truth.json by the generator and never read by the model.

layer: layer_p
title: "Layer P, synthetic advertiser with known truth"
output_dir: reports/layer_p
data_dir: data/synthetic

channels: ["TV", "Radio", "Print", "Paid Search", "Paid Social"]
control:
  name: "Public holiday week"
  column: holiday

model:
  adstock_length: 13      # lags kept in the truncated geometric adstock
  fourier_order: 2        # yearly Fourier pairs
  fourier_period: 52.18   # weeks per year

# Priors on scaled data: revenue divided by its mean, spend divided by the mean of
# each channel's positive-spend weeks. Every prior is channel-agnostic on purpose:
# recovery has to come from the data and the structure, not from a prior that
# encodes the truth table. The reasoning behind each family is in model.py.
priors:
  decay: {dist: beta, a: 2.0, b: 3.0}
  half_saturation: {dist: gamma, shape: 2.0, rate: 1.0}
  slope: {dist: lognormal, mu: 0.0, sigma: 0.5}
  effect: {dist: halfnormal, sigma: 0.3}
  intercept: {dist: normal, mu: 1.0, sigma: 0.5}
  trend: {dist: normal, mu: 0.0, sigma: 0.3}
  seasonality: {dist: normal, mu: 0.0, sigma: 0.2}
  control: {dist: normal, mu: 0.0, sigma: 0.2}
  noise: {dist: halfnormal, sigma: 0.1}

sampling:
  sampler: nutpie         # falls back to the PyMC sampler if nutpie is unavailable
  chains: 2
  tune: 1000
  draws: 1000
  target_accept: 0.9
  seed: 42
  max_minutes: 20         # hard cap per fit; exceeded means draws are halved and logged

diagnostics:
  rhat_max: 1.01
  ess_min: 400
  divergences_max: 0

holdout:
  train_weeks: 130        # fit on weeks 1..130, predict 131..156
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]

# Everything below is the disclosed data-generating process. Money in euros per
# week. Adstock decay per channel, Hill half-saturation on adstocked spend in
# euros, Hill slope, and the effect at full saturation in euros per week.
synthetic:
  seed: 20260915
  weeks: 156
  start: "2023-01-02"
  baseline:
    intercept: 80000
    trend: 12000            # total drift over the window, euros per week at the end
    seasonality: [-3700, 9300, -2800, -1100]   # sin1, cos1, sin2, cos2 in euros; peak in early December, second bump in spring
    control: -4000          # public holiday week effect in euros
    noise_sigma: 3500
  channels:
    TV:
      decay: 0.60
      half_saturation: 40000
      slope: 1.4
      effect: 40000
      spend: {pattern: flighted, level: 25000, sd: 3000, burst_weeks: 3, bursts_per_year: 6, seasonal: 0.6}
      platform: null
    Radio:
      decay: 0.40
      half_saturation: 10000
      slope: 1.1
      effect: 12000
      spend: {pattern: flighted, level: 8000, sd: 1000, burst_weeks: 2, bursts_per_year: 8, seasonal: 0.4}
      platform: null
    Print:
      decay: 0.50
      half_saturation: 9000
      slope: 1.2
      effect: 12000
      spend: {pattern: flighted, level: 6000, sd: 800, burst_weeks: 2, bursts_per_year: 8, seasonal: 0.5}
      platform: null
    "Paid Search":
      decay: 0.15
      half_saturation: 5000
      slope: 0.9
      effect: 25000
      spend: {pattern: always_on, level: 5000, sd: 1200, seasonal: 0.8, pulse_every: 8, pulse_factor: 1.6}
      platform: {own_inflation: 1.3, demand_claim: 0.08}
    "Paid Social":
      decay: 0.30
      half_saturation: 5000
      slope: 1.0
      effect: 15000
      spend: {pattern: always_on, level: 4000, sd: 1200, seasonal: 0.5, pulse_every: 5, pulse_factor: 2.0}
      platform: {own_inflation: 1.5, demand_claim: 0.02}
