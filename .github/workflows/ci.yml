name: ci

on:
  push:
    branches: [main, build/ambo]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-extras --python 3.11

      - name: Lint
        run: uv run ruff check .

      - name: Tests (fast)
        run: uv run pytest -m "not slow"
