name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-extras --python 3.11

      - name: Lint
        run: uv run ruff check .

      - name: Tests (fast)
        run: uv run pytest -m "not slow"

      - name: Smoke run of the Layer P pipeline on the tiny config
        run: timeout 180 uv run python -m ambo.run layer_p --config src/ambo/configs/tiny.yaml --out /tmp/smoke/reports --data /tmp/smoke/data

      - name: Smoke run of Layer R on the tiny Layer R config
        run: timeout 420 uv run python -m ambo.run layer_r --config src/ambo/configs/tiny_layer_r.yaml --out /tmp/smoke/layer_r

      - name: Smoke run of Layer D on the tiny Layer R posterior
        run: timeout 120 uv run python -m ambo.run layer_d --config src/ambo/configs/tiny_layer_r.yaml --data /tmp/smoke/layer_r --out /tmp/smoke/layer_d

      - name: Committed notebook matches its builder
        run: uv run python scripts/build_notebook.py --check

      - name: Execute the walkthrough notebook on the tiny config
        run: timeout 300 uv run python scripts/build_notebook.py --execute --timeout 280
