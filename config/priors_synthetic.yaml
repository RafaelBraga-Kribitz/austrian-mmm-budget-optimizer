# AMBO — Layer P weakly informative priors (MD-040).
#
# Channel-agnostic on purpose: every SPEC-02 §5.2 channel has identical
# Beta(2, 4) on λ, Gamma(2, 1.3) on K, truncated Gamma(3, 2) on s in
# [0.3, 3.0], and HalfNormal(0.15) on β. Recovery must come from data plus
# structure, not from priors that encode the truth table.
# tests/unit/test_priors.py asserts value-equality across the seven entries.
#
# K is in SCALED spend units (Gamma(2, 1.3) mean = 2/1.3 ≈ 1.538 ≈ 1.5× mean
# scaled spend). Globals match SPEC-04 §4 exactly.
#
# Do not put Layer R / elicited values here. config/priors_real.yaml is
# authored at M4 and is never invented by this file.

channels:
  search_brand:
    lam:
      a: 2.0
      b: 4.0
    K:
      shape: 2.0
      rate: 1.3
    s:
      shape: 3.0
      rate: 2.0
      lower: 0.3
      upper: 3.0
    beta:
      sigma: 0.15
