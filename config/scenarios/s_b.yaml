# AMBO — Scenario S-B: realistic, collinear (SIM-002, SPEC-01 section 5).
#
# This file is the authoritative source for every SPEC-01 section 2.1/3/4/5/6
# parameter of scenario S-B. No value here is duplicated in config/settings.yaml
# or anywhere in src/ (SIM-002) -- `ambo.simulate.config.load_scenario("s_b")`
# parses this file with `extra='forbid'`, so an unknown key here is a load-time
# failure, not a silently ignored parameter. `tests/unit/test_scenario_config.py`
# asserts every value below equals SPEC-01's own tables (BP-G-02) -- if they ever
# diverge, that test fails and a human reconciles, never a silent "fix" toward
# either side.
#
# S-B: 104 weeks (2022-W01..2023-W52), seed 202, collinearity ON -- 2 realistic
# years where spend follows the demand calendar (SPEC-01 section 5).

id: s_b
weeks: 104
seed: 202
start_iso_year: 2022
start_iso_week: 1
end_iso_year: 2023
end_iso_week: 52
collinearity: true

# Baseline demand (SPEC-01 section 2.1). Shared verbatim across S-A/S-B/S-C.
b0: 60000.0
growth: 0.001
noise_share: 0.04
aov_base: 95.0
aov_advent_bonus: 10.0
promo_multiplier: 1.15

# Season-index weights (SPEC-01 section 2.1). Shared verbatim across all three
# scenarios; window membership itself (which weeks are "advent", "spring", ...)
# is read from dbt/seeds/season_windows.csv by simulate/dgp.py (AD-020), never
# recomputed here.
season_weights:
  advent: 0.55
  schulbeginn: 0.25
  spring: 0.15
  jan_dip: -0.20
  summer_lull: -0.10

# Promo weeks (SPEC-01 section 2.1: 10 pre-scheduled promo weeks/year, Guide
# section 1.1). Anchored weeks (Black Friday week, the 2 Advent-flagged weeks
# nearest Dec 24, 2 spring weeks) plus 5 spread weeks/year, frozen verbatim from
# `uv run python scripts/author_scenario_schedules.py --scenario s_b`
# (CONTEXT.md D-02) -- do not hand-edit a single week number; re-run the aid and
# re-paste instead, so provenance stays auditable.
promo_weeks:
  2022: [8, 12, 15, 17, 20, 39, 44, 47, 50, 51]
  2023: [13, 17, 20, 26, 28, 42, 44, 47, 50, 51]

# Per-channel true media parameters (SPEC-01 section 4), spend patterns (SPEC-01
# section 3) and platform-bias parameters (SPEC-01 section 6). Keys appear in
# SPEC_CHANNEL_ORDER; `other` (the Layer R taxonomy slot) never appears here.
# Identical to s_a.yaml except: collinearity ON (advent_factor 0.5 -> 0.9 for
# search_generic/meta, SIM-030), the window/seed above, and the promo/burst
# schedule lists (which legitimately differ because the window and seed differ,
# per 02-RESEARCH.md Pitfall 7 -- not a sign of drift).
channels:
  search_brand:
    true_params:
      lam: 0.10
      K: 800.0
      s: 1.2
      beta: 6000.0
    spend:
      mean: 700.0
      sd: 60.0
      floor_eur: 400
      advent_factor: 0.0
      spring_factor: 0.0
      pulse_every: null
      pulse_multiplier: null
      burst_length: null
      burst_starts: null
    platform:
      phi: 1.1
      theta: 0.05
      # cpm: authored, not spec-given (BP-D-02); recorded for
      # docs/BUILD_LOG.md at M1 close; identical across S-A/S-B/S-C.
      cpm: 12.0

  search_generic:
    true_params:
      lam: 0.20
      K: 3000.0
      s: 1.0
      beta: 15000.0
    spend:
      mean: 2500.0
      sd: 200.0
      floor_eur: null
      # advent_factor: the SIM-030 collinearity switch, expressed in data, not
      # code. S-A (collinearity OFF) = 0.5; S-B/S-C (collinearity ON) = 0.9
      # (SPEC-01 section 3 / Guide section 1.3).
      advent_factor: 0.9
      spring_factor: 0.2
      pulse_every: null
      pulse_multiplier: null
      burst_length: null
      burst_starts: null
    platform:
      phi: 1.3
      theta: 0.01
      cpm: 20.0

  meta:
    true_params:
      lam: 0.35
      K: 2500.0
      s: 0.9
      beta: 12000.0
    spend:
      mean: 2000.0
      sd: 300.0
      floor_eur: null
      # advent_factor: SPEC-01 section 3's meta row states no seasonal
      # multiplier by itself, but SIM-030 says the advent factor moves
      # 0.5->0.9 "for search_generic/meta", which presupposes a 0.5 baseline
      # for meta in S-A -- an interpretation recorded for docs/BUILD_LOG.md at
      # M1 close (Guide section 1.3 resolves the switch as data, not code).
      advent_factor: 0.9
      spring_factor: 0.0
      pulse_every: 6
      pulse_multiplier: 1.8
      burst_length: null
      burst_starts: null
    platform:
      phi: 1.5
      theta: 0.01
      cpm: 6.0

  display_video:
    true_params:
      lam: 0.50
      K: 2000.0
      s: 1.1
      beta: 6000.0
    spend:
      mean: 1200.0
      sd: 150.0
      floor_eur: null
      advent_factor: 0.0
      spring_factor: 0.0
      pulse_every: null
      pulse_multiplier: null
      burst_length: null
      burst_starts: null
    platform:
      phi: 2.0
      theta: 0.005
      cpm: 4.0

  print_regional:
    true_params:
      lam: 0.60
      K: 4000.0
      s: 1.3
      beta: 8000.0
    spend:
      mean: 5000.0
      sd: 500.0
      floor_eur: null
      advent_factor: 0.0
      spring_factor: 0.0
      pulse_every: null
      pulse_multiplier: null
      burst_length: 2
      # burst_starts: frozen verbatim from `uv run python
      # scripts/author_scenario_schedules.py --scenario s_b` (CONTEXT.md D-02);
      # 3 anchored (2 in Advent, 1 in Schulbeginn) + 5 spread per year (Guide
      # section 1.1). Do not hand-edit; re-run the aid instead.
      burst_starts:
        2022: [8, 23, 32, 34, 36, 40, 48, 50]
        2023: [1, 18, 24, 34, 36, 44, 48, 50]
    platform:
      phi: null
      theta: null
      cpm: null

  radio:
    true_params:
      lam: 0.55
      K: 3500.0
      s: 1.2
      beta: 5000.0
    spend:
      mean: 3500.0
      sd: 300.0
      floor_eur: null
      advent_factor: 0.0
      spring_factor: 0.0
      pulse_every: null
      pulse_multiplier: null
      burst_length: 3
      # burst_starts: frozen verbatim from `uv run python
      # scripts/author_scenario_schedules.py --scenario s_b` (CONTEXT.md D-02);
      # 2 anchored in Advent (lead-in + in-Advent) + 3 spread per year (Guide
      # section 1.1). Do not hand-edit; re-run the aid instead.
      burst_starts:
        2022: [2, 14, 41, 45, 48]
        2023: [3, 21, 25, 45, 48]
    platform:
      phi: null
      theta: null
      cpm: null
